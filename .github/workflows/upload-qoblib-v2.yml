name: Upload qoblib_v2 to GHCR

# Manual-only. Pushes the regenerated qoblib_v2 OMMX archives to GHCR using
# the workflow's GITHUB_TOKEN (packages: write). Each dataset runs in its own
# job in parallel; failures inside a job do not abort the others.

on:
  workflow_dispatch:
    inputs:
      datasets:
        description: 'Datasets to push, space-separated (e.g. "02_labs 03_birkhoff"). Use "all" for every dataset.'
        type: string
        required: true
        default: '02_labs'
      max-workers:
        description: 'Parallel push workers per dataset job.'
        type: number
        required: true
        default: 8

permissions:
  contents: read
  packages: write

env:
  QOBLIB_UPSTREAM: "https://git.zib.de/qopt/qoblib-quantum-optimization-benchmarking-library.git"

jobs:
  resolve-matrix:
    runs-on: ubuntu-latest
    outputs:
      datasets: ${{ steps.expand.outputs.datasets }}
    steps:
      - name: Expand datasets input into JSON matrix
        id: expand
        shell: bash
        run: |
          set -eu
          INPUT='${{ inputs.datasets }}'
          ALL='01_marketsplit 02_labs 03_birkhoff 04_steiner 07_independentset 08_network 09_routing 10_topology'
          if [ "$INPUT" = "all" ]; then
            ITEMS="$ALL"
          else
            ITEMS="$INPUT"
          fi
          echo "Selected datasets: $ITEMS"
          JSON=$(printf '%s\n' $ITEMS | jq -R . | jq -s -c .)
          echo "datasets=$JSON" >> "$GITHUB_OUTPUT"

  upload:
    needs: resolve-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        dataset: ${{ fromJson(needs.resolve-matrix.outputs.datasets) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Sparse-clone upstream qoblib dataset
        shell: bash
        run: |
          set -eu
          DS="${{ matrix.dataset }}"
          UPSTREAM_SUBDIR="${DS/_/-}"   # e.g. 02_labs -> 02-labs
          SRC=/tmp/qoblib-src
          rm -rf "$SRC"
          mkdir -p "$SRC"
          cd "$SRC"
          git init -q
          git remote add origin "$QOBLIB_UPSTREAM"
          git config core.sparseCheckout true
          printf '%s\n' \
            "$UPSTREAM_SUBDIR/instances/" \
            "$UPSTREAM_SUBDIR/solutions/" \
            > .git/info/sparse-checkout
          git pull --depth=1 origin main
          DEST="${{ github.workspace }}/ommx_quantum_benchmarks/qoblib/$DS"
          cp -r "$UPSTREAM_SUBDIR/instances" "$DEST/"
          cp -r "$UPSTREAM_SUBDIR/solutions" "$DEST/"
          echo "Data prepared at $DEST"
          ls -la "$DEST"

      - name: Generate .ommx archives
        working-directory: ommx_quantum_benchmarks/qoblib/${{ matrix.dataset }}/models
        shell: bash
        run: |
          set -eu
          for model_dir in */; do
            MODEL="${model_dir%/}"
            echo "=== Generating .ommx for $MODEL ==="
            (cd "$MODEL" && uv run --project=${{ github.workspace }} python ommx_create.py)
            echo "Sample output for $MODEL:"
            ls -la "$MODEL/ommx_output" 2>/dev/null | head -5 || true
          done

      - name: Push to GHCR
        env:
          OMMX_BASIC_AUTH_USERNAME: ${{ github.actor }}
          OMMX_BASIC_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python scripts/upload_qoblib.py \
            --datasets "${{ matrix.dataset }}" \
            --max-workers ${{ inputs.max-workers }}

  summary:
    needs: upload
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print result
        run: |
          echo "Upload jobs finished."
          echo "Check the matrix job results for per-dataset success/failure."
          echo "On success, see https://github.com/orgs/Jij-Inc/packages?repo_name=OmmxQuantumBenchmarks"
