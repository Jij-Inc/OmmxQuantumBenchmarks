name: Upload qoblib_v2 to GHCR

# Manual-only. Migrates the existing qoblib (minto 1.x layout) artifacts on
# GHCR to a new qoblib_v2 image with the minto 2.x layout, using the workflow's
# GITHUB_TOKEN (packages: write). Each dataset runs in its own job in parallel;
# failures inside a job do not abort the others.

on:
  workflow_dispatch:
    inputs:
      datasets:
        description: 'Datasets to migrate, space-separated (e.g. "02_labs 03_birkhoff"). Use "all" for every dataset.'
        type: string
        required: true
        default: '02_labs'
      max-workers:
        description: 'Parallel worker threads per dataset job.'
        type: number
        required: true
        default: 8

permissions:
  contents: read
  packages: write

jobs:
  resolve-matrix:
    runs-on: ubuntu-latest
    outputs:
      datasets: ${{ steps.expand.outputs.datasets }}
    steps:
      - name: Expand datasets input into JSON matrix
        id: expand
        shell: bash
        run: |
          set -eu
          INPUT='${{ inputs.datasets }}'
          ALL='01_marketsplit 02_labs 03_birkhoff 04_steiner 07_independentset 08_network 09_routing 10_topology'
          if [ "$INPUT" = "all" ]; then
            ITEMS="$ALL"
          else
            ITEMS="$INPUT"
          fi
          echo "Selected datasets: $ITEMS"
          JSON=$(printf '%s\n' $ITEMS | jq -R . | jq -s -c .)
          echo "datasets=$JSON" >> "$GITHUB_OUTPUT"

  upload:
    needs: resolve-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        dataset: ${{ fromJson(needs.resolve-matrix.outputs.datasets) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Migrate qoblib -> qoblib_v2 for ${{ matrix.dataset }}
        env:
          OMMX_BASIC_AUTH_USERNAME: ${{ github.actor }}
          OMMX_BASIC_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python scripts/upload_qoblib.py \
            --datasets "${{ matrix.dataset }}" \
            --max-workers ${{ inputs.max-workers }}

  summary:
    needs: upload
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print result
        run: |
          echo "Migration jobs finished."
          echo "Check the matrix job results for per-dataset success/failure."
          echo "On success, see https://github.com/orgs/Jij-Inc/packages?repo_name=OmmxQuantumBenchmarks"
