[build-system]
requires = ["setuptools >= 64", "setuptools_scm >= 8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ommx-quantum-benchmarks"
dynamic = ["version"]
description = "Quantum Benchmark dataset in OMMX format"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jijmodeling>=1.13.0",
    "minto>=2.0.0",
    "numpy>=2.2.6",
    "ommx>=2.0.4",
    "requests>=2.32.4",
]

[project.optional-dependencies]
pbo = ["ioh==0.3.22"]

[tool.setuptools.packages.find]
include = ["ommx_quantum_benchmarks*"]
namespaces = true

[tool.setuptools.package-data]
"ommx_quantum_benchmarks.blackbox" = [
    "COMBO-LICENSE.txt",
    "sources.lock.json",
    "data/*.json",
    "data/prepared/*.npz",
]

[tool.setuptools_scm]
version_file = "ommx_quantum_benchmarks/_version.py"
local_scheme = "no-local-version"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]
docs = [
    "jupyter-book>=1.0.4.post1",
    "matplotlib>=3.10.5",
    "ommx-pyscipopt-adapter>=2.0.9",
    "sphinx-autoapi>=3.6.0",
    "sphinx-copybutton>=0.5.2",
]
